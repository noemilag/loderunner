<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Runner">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=4">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=4">
<link rel="manifest" href="manifest.json?v=6">
<title>Runner</title>
<meta name="app-version" content="/*VERSION*/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: arcade de mine, chaleureux et espiègle, pour un parent et son enfant
   IDEA: une borne d'arcade taillée dans la roche, la partie est le tableau lumineux
   PICTURE: le plateau de jeu pixelisé, grand, au centre, cerclé d'un boîtier de pierre
   COLOUR and TYPE: nuit de mine bleu profond, or des pépites en accent, Lilita One + Nunito
   LAYOUT: barre d'état au-dessus, plateau, aide des touches dessous; panneaux en superposition */
:root{color-scheme:dark;--bg:#0c0f22;--case:#1a1f3d;--case2:#262c55;--ink:#f6f0dc;--muted:#a9aed6;--gold:#fbbf24;--gold2:#fde68a;--mint:#34d399;--red:#fb7185;--line:#343b6e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#232a5c 0,#0c0f22 60%) fixed;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
#app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 12px 20px}
.wrap{width:var(--w,896px);max-width:100%}
#hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.lvl{font-family:"Lilita One",system-ui;font-size:20px;letter-spacing:.5px;line-height:1.1}
.lvl small{display:block;font:800 13px Nunito,sans-serif;color:var(--muted)}
.stats{display:flex;gap:16px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat i{display:inline-block;width:18px;height:12px;background:linear-gradient(#fde68a,#f59e0b);border-radius:2px;box-shadow:inset 0 -3px #b45309}
.hearts{color:var(--red);letter-spacing:2px}
.tools{display:flex;gap:6px}
.ib{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--case);color:var(--ink);font:800 17px Nunito,system-ui,sans-serif;cursor:pointer;display:grid;place-items:center}
.ib:hover{border-color:var(--gold)}
#stage{position:relative;border-radius:16px;padding:10px;background:linear-gradient(#2a3163,#161a36);box-shadow:0 0 0 2px #3b4380 inset,0 18px 50px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:8px;background:#0c0e20;touch-action:none}
.ov{position:absolute;inset:10px;border-radius:8px;display:none;align-items:center;justify-content:center;background:rgba(9,11,28,.74);backdrop-filter:blur(3px);padding:16px;overflow:auto}
.ov.on{display:flex;align-items:flex-start;justify-content:flex-start}
.ov>.panel{margin:auto}
.panel{background:var(--case);border:2px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);width:min(560px,100%);text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.logo{font-family:"Lilita One",system-ui;font-size:clamp(32px,6vw,52px);line-height:1.02;color:var(--gold);text-shadow:0 4px 0 #9a3412,0 8px 24px rgba(251,191,36,.25);margin:0 0 8px}
.logo span{color:var(--ink)}
h2{font-family:"Lilita One",system-ui;font-weight:400;font-size:32px;line-height:1.05;margin:0 0 8px;color:var(--gold)}
p{margin:0 0 14px;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:340px;margin:0 auto}
.btn{min-height:46px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--case2);color:var(--ink);font:800 16px Nunito,system-ui,sans-serif;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--gold);outline:none}
.btn.pri{background:linear-gradient(#fcd34d,#f59e0b);color:#3b1d06;border-color:#fde68a;box-shadow:0 4px 0 #b45309}
.btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 #b45309}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.seg button{border:0;background:transparent;color:var(--muted);font:800 14px Nunito,system-ui,sans-serif;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--gold);color:#3b1d06}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0 14px;text-align:left}
.card{border:2px solid var(--line);background:var(--case2);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;min-height:72px}
.card b{font-family:"Lilita One",system-ui;font-weight:400;font-size:24px;color:var(--gold);display:block;line-height:1}
.card span{font-weight:800;font-size:14px}
.card:hover{border-color:var(--gold)}.card[disabled]{opacity:.4;cursor:not-allowed}
.sub{font:800 13px Nunito,system-ui,sans-serif;color:var(--muted);margin:6px 0 0;text-align:left}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;text-align:left;margin:12px 0 16px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend img,.pal img{width:28px;height:28px;image-rendering:pixelated;flex:none}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;text-align:left;font-size:15px;align-items:center}
kbd{display:inline-block;min-width:28px;padding:2px 7px;border-radius:7px;background:#0f1330;border:2px solid var(--line);border-bottom-width:4px;font:800 13px Nunito,system-ui,sans-serif;color:var(--ink);text-align:center}
#help{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:14px;font-weight:600}
#tip{min-height:22px;text-align:center;color:var(--gold2);font-weight:800;font-size:15px}
#editbar{display:none;flex-direction:column;gap:10px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--case);color:var(--ink);font:800 13px Nunito,system-ui,sans-serif;cursor:pointer}
.pal button.on{border-color:var(--gold);background:var(--case2);box-shadow:0 0 0 2px rgba(251,191,36,.25)}
.erow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.erow input{flex:1 1 180px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:#0f1330;color:var(--ink);font:800 16px Nunito,system-ui,sans-serif;padding:0 12px}
textarea{width:100%;min-height:96px;border-radius:12px;border:2px solid var(--line);background:#0f1330;color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:10px;resize:vertical}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--case2);border:2px solid var(--gold);padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
.mylist{display:flex;flex-direction:column;gap:8px;text-align:left;margin:8px 0 14px;max-height:46vh;overflow:auto}
.mylist .it{display:flex;gap:6px;align-items:center;background:var(--case2);border-radius:12px;padding:6px 6px 6px 12px}
.mylist .it span{flex:1;font-weight:800}
.mylist .btn{min-height:40px;padding:6px 10px;font-size:14px}

/* ---- look 1985 ---- */
body.retro{background:#000;--case:#000;--case2:#0d0d0d;--line:#f2f2f2;--gold:#ffd23f;--muted:#c8c8c8;--ink:#f2f2f2;font-family:"Press Start 2P",monospace;font-size:12px;line-height:1.7}
body.retro .lvl,body.retro .logo,body.retro h2{font-family:"Press Start 2P",monospace;letter-spacing:0}
body.retro .lvl{font-size:14px}body.retro .lvl small{font:10px "Press Start 2P",monospace;margin-top:4px}
body.retro .logo{font-size:clamp(20px,4vw,34px);line-height:1.3;text-shadow:4px 4px 0 #d0581c;color:#ffd23f}
body.retro h2{font-size:20px;line-height:1.4;color:#ffd23f}
body.retro #stage{background:#000;border-radius:0;padding:8px;box-shadow:0 0 0 4px #f2f2f2,0 0 0 8px #000,0 0 0 12px #d0581c}
body.retro #stage::after{content:"";position:absolute;inset:8px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px)}
body.retro canvas,body.retro .ov{border-radius:0}
body.retro .ov{background:rgba(0,0,0,.82);backdrop-filter:none;z-index:2}
body.retro .panel{border-radius:0;border:4px solid #f2f2f2;box-shadow:8px 8px 0 #d0581c}
body.retro .btn,body.retro .ib,body.retro .seg,body.retro .card,body.retro .pal button,body.retro .erow input,body.retro textarea,body.retro .mylist .it{border-radius:0;font-family:"Press Start 2P",monospace;font-size:11px}
body.retro .btn{border-width:3px;line-height:1.5}
body.retro .btn.pri{background:#ffd23f;color:#000;border-color:#ffd23f;box-shadow:4px 4px 0 #d0581c}
body.retro .seg button{font:10px "Press Start 2P",monospace}body.retro .seg button.on{background:#f2f2f2;color:#000}
body.retro .card b{font:18px "Press Start 2P",monospace;color:#ffd23f;margin-bottom:6px}body.retro .card span{font-size:10px}
body.retro .stat i{border-radius:0;background:#ffd23f;box-shadow:none}
body.retro .hearts{color:#fff}
body.retro kbd{border-radius:0;font:10px "Press Start 2P",monospace;padding:4px 6px}
body.retro #help,body.retro #tip,body.retro p,body.retro .keys,body.retro .legend{font-size:10px;line-height:1.9}
body.retro #tip{color:#ffd23f}
body.retro #toast{border-radius:0;font:10px "Press Start 2P",monospace}

/* ---- contrôles tactiles ---- */
#arena{display:contents}
.pad{display:none}
body.touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.touch #help{display:none!important}
body.touch #app{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:8px;min-height:100dvh}
body.touch #arena{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"stage stage" "l r";gap:18px 16px;width:var(--w);max-width:100%;align-items:end;flex:1 1 auto;padding-bottom:12px}
body.touch #stage{grid-area:stage}
body.touch .pad{display:flex;align-items:flex-end;touch-action:none}
body.touch #padL{grid-area:l;justify-content:flex-start}
body.touch #padR{grid-area:r;justify-content:flex-end;gap:var(--gap,12px)}
#dpad{position:relative;width:var(--pad,150px);height:var(--pad,150px);border-radius:50%;background:radial-gradient(circle,#1d2347 0 30%,#141836 31%);border:3px solid var(--line);touch-action:none;flex:none}
#dpad span{position:absolute;color:var(--muted);font-size:20px;line-height:1;pointer-events:none}
#dpad .u{top:10%;left:50%;transform:translateX(-50%)}#dpad .d{bottom:10%;left:50%;transform:translateX(-50%)}
#dpad .l{left:10%;top:50%;transform:translateY(-50%)}#dpad .r{right:10%;top:50%;transform:translateY(-50%)}
#dpad span.on{color:var(--gold)}
#dpad i{position:absolute;width:34%;height:34%;left:33%;top:33%;border-radius:50%;background:var(--case2);border:2px solid var(--line);pointer-events:none;transition:transform .05s}
.dig{width:var(--dig,76px);height:var(--dig,76px);flex:none;border-radius:50%;border:3px solid var(--gold);background:var(--case2);color:var(--ink);font:800 12px Nunito,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none}
.dig b{font-size:24px;color:var(--gold);line-height:1}
.dig.on{background:var(--gold);color:#000}.dig.on b{color:#000}
/* le bouton de droite un peu plus haut : les pouces tombent naturellement dessus */
#digR{margin-bottom:calc(var(--dig,76px)*.45)}
@media (orientation:landscape){
 body.touch #app{gap:4px;padding-left:max(6px,calc(env(safe-area-inset-left) - 26px));padding-right:max(6px,calc(env(safe-area-inset-right) - 26px));padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,calc(env(safe-area-inset-bottom) - 8px))}
 body.touch #hud{width:var(--w)}
 body.touch #arena{flex:0 0 auto;grid-template-rows:auto;padding-bottom:0;grid-template-columns:var(--lw) var(--w) var(--rw);grid-template-areas:"l stage r";gap:0 var(--gap,16px);width:auto;justify-content:center;align-items:end}
 body.touch #stage{width:var(--w)}
 body.touch #padL{justify-content:flex-start}
 /* boutons Creuser l'un au-dessus de l'autre : droite en haut, gauche en bas */
 body.touch #padR{flex-direction:column-reverse;align-items:center;gap:12px;width:var(--rw)}
 body.touch #digL,body.touch #digR{margin:0}
 body.touch #tip{display:none}
}
body.retro #dpad{border-radius:0;background:#000;border:4px solid #f2f2f2}
body.retro #dpad i{border-radius:0;background:#000;border-color:#f2f2f2}
body.retro .dig{border-radius:0;background:#000;font:8px "Press Start 2P",monospace;letter-spacing:-.5px}
body.retro .dig.on{background:#ffd23f}
body.touch .ov{position:fixed;inset:0;border-radius:0;z-index:20;padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(0,0,0,.92)}
body.touch .panel{padding:20px 16px}
body.touch #hud{gap:8px;flex-wrap:nowrap}
body.touch .lvl{font-size:15px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.touch .lvl small{display:none}
body.touch.retro .lvl{font-size:11px}
body.touch.retro .stats{font-size:10px}
body.touch .ib{width:40px;height:40px}
body.touch .stats{gap:8px;font-size:13px}
#bFull{display:none}body.touch #bFull.ok{display:grid}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:600px){.stats{gap:10px}.lvl{font-size:17px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="wrap">
    <div class="lvl" id="lvl">Runner<small>Une mine, un coureur, des robots</small></div>
    <div class="stats" id="stats">
      <div class="stat" title="Pépites restantes"><i></i><span id="sGold">0/0</span></div>
      <div class="stat hearts" id="sLives" title="Vies"></div>
      <div class="stat" title="Points"><span id="sScore">0</span></div>
    </div>
    <div class="tools">
      <button class="ib" id="bFull" title="Plein écran" aria-label="Plein écran">⛶</button>
      <button class="ib" id="bPause" title="Pause (Échap)" aria-label="Pause">❚❚</button>
      <button class="ib" id="bSound" title="Son" aria-label="Son">♪</button>
      <button class="ib" id="bMenu" title="Menu" aria-label="Menu">≡</button>
    </div>
  </div>
  <div id="arena">
  <div class="pad" id="padL"><div id="dpad" aria-label="Croix directionnelle"><span class="u">▲</span><span class="l">◀</span><span class="r">▶</span><span class="d">▼</span><i></i></div></div>
  <div id="stage" class="wrap">
    <canvas id="cv" width="896" height="512"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <div class="pad" id="padR"><button class="dig" id="digL" aria-label="Creuser à gauche"><b>◣</b>Gauche</button><button class="dig" id="digR" aria-label="Creuser à droite"><b>◢</b>Droite</button></div>
  </div>
  <div id="tip" class="wrap"></div>
  <div id="editbar" class="wrap">
    <div class="pal" id="pal"></div>
    <div class="erow">
      <input id="edName" maxlength="28" aria-label="Nom du niveau" placeholder="Nom du niveau">
      <button class="btn pri" id="eTest">▶ Tester</button>
      <button class="btn" id="eSave">Enregistrer</button>
      <button class="btn" id="eMine">Mes niveaux</button>
      <button class="btn" id="eShare">Partager</button>
      <button class="btn" id="eClear">Vider</button>
    </div>
  </div>
  <div id="help" class="wrap">
    <span><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> bouger</span>
    <span><kbd>Z</kbd> creuser à gauche · <kbd>X</kbd> creuser à droite</span>
    <span><kbd>Échap</kbd> pause · <kbd>R</kbd> recommencer</span>
  </div>
</div>
<div id="toast"></div>
<script>
/*ENGINE*/
</script>
<script>
{
const LEVELS=/*LEVELS*/;
/*UI*/
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Pépites">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Pioche et Pépites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: arcade de mine, chaleureux et espiègle, pour un parent et son enfant
   IDEA: une borne d'arcade taillée dans la roche, la partie est le tableau lumineux
   PICTURE: le plateau de jeu pixelisé, grand, au centre, cerclé d'un boîtier de pierre
   COLOUR and TYPE: nuit de mine bleu profond, or des pépites en accent, Lilita One + Nunito
   LAYOUT: barre d'état au-dessus, plateau, aide des touches dessous; panneaux en superposition */
:root{color-scheme:dark;--bg:#0c0f22;--case:#1a1f3d;--case2:#262c55;--ink:#f6f0dc;--muted:#a9aed6;--gold:#fbbf24;--gold2:#fde68a;--mint:#34d399;--red:#fb7185;--line:#343b6e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#232a5c 0,#0c0f22 60%) fixed;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
#app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 12px 20px}
.wrap{width:var(--w,896px);max-width:100%}
#hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.lvl{font-family:"Lilita One",system-ui;font-size:20px;letter-spacing:.5px;line-height:1.1}
.lvl small{display:block;font:800 13px Nunito,sans-serif;color:var(--muted)}
.stats{display:flex;gap:16px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat i{display:inline-block;width:18px;height:12px;background:linear-gradient(#fde68a,#f59e0b);border-radius:2px;box-shadow:inset 0 -3px #b45309}
.hearts{color:var(--red);letter-spacing:2px}
.tools{display:flex;gap:6px}
.ib{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--case);color:var(--ink);font:800 17px Nunito,system-ui,sans-serif;cursor:pointer;display:grid;place-items:center}
.ib:hover{border-color:var(--gold)}
#stage{position:relative;border-radius:16px;padding:10px;background:linear-gradient(#2a3163,#161a36);box-shadow:0 0 0 2px #3b4380 inset,0 18px 50px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:8px;background:#0c0e20;touch-action:none}
.ov{position:absolute;inset:10px;border-radius:8px;display:none;align-items:center;justify-content:center;background:rgba(9,11,28,.74);backdrop-filter:blur(3px);padding:16px;overflow:auto}
.ov.on{display:flex}
.panel{background:var(--case);border:2px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);width:min(560px,100%);text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.logo{font-family:"Lilita One",system-ui;font-size:clamp(32px,6vw,52px);line-height:1.02;color:var(--gold);text-shadow:0 4px 0 #9a3412,0 8px 24px rgba(251,191,36,.25);margin:0 0 8px}
.logo span{color:var(--ink)}
h2{font-family:"Lilita One",system-ui;font-weight:400;font-size:32px;line-height:1.05;margin:0 0 8px;color:var(--gold)}
p{margin:0 0 14px;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:340px;margin:0 auto}
.btn{min-height:46px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--case2);color:var(--ink);font:800 16px Nunito,system-ui,sans-serif;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--gold);outline:none}
.btn.pri{background:linear-gradient(#fcd34d,#f59e0b);color:#3b1d06;border-color:#fde68a;box-shadow:0 4px 0 #b45309}
.btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 #b45309}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.seg button{border:0;background:transparent;color:var(--muted);font:800 14px Nunito,system-ui,sans-serif;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--gold);color:#3b1d06}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0 14px;text-align:left}
.card{border:2px solid var(--line);background:var(--case2);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;min-height:72px}
.card b{font-family:"Lilita One",system-ui;font-weight:400;font-size:24px;color:var(--gold);display:block;line-height:1}
.card span{font-weight:800;font-size:14px}
.card:hover{border-color:var(--gold)}.card[disabled]{opacity:.4;cursor:not-allowed}
.sub{font:800 13px Nunito,system-ui,sans-serif;color:var(--muted);margin:6px 0 0;text-align:left}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;text-align:left;margin:12px 0 16px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend img,.pal img{width:28px;height:28px;image-rendering:pixelated;flex:none}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;text-align:left;font-size:15px;align-items:center}
kbd{display:inline-block;min-width:28px;padding:2px 7px;border-radius:7px;background:#0f1330;border:2px solid var(--line);border-bottom-width:4px;font:800 13px Nunito,system-ui,sans-serif;color:var(--ink);text-align:center}
#help{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:14px;font-weight:600}
#tip{min-height:22px;text-align:center;color:var(--gold2);font-weight:800;font-size:15px}
#editbar{display:none;flex-direction:column;gap:10px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--case);color:var(--ink);font:800 13px Nunito,system-ui,sans-serif;cursor:pointer}
.pal button.on{border-color:var(--gold);background:var(--case2);box-shadow:0 0 0 2px rgba(251,191,36,.25)}
.erow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.erow input{flex:1 1 180px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:#0f1330;color:var(--ink);font:800 16px Nunito,system-ui,sans-serif;padding:0 12px}
textarea{width:100%;min-height:96px;border-radius:12px;border:2px solid var(--line);background:#0f1330;color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:10px;resize:vertical}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--case2);border:2px solid var(--gold);padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
.mylist{display:flex;flex-direction:column;gap:8px;text-align:left;margin:8px 0 14px;max-height:46vh;overflow:auto}
.mylist .it{display:flex;gap:6px;align-items:center;background:var(--case2);border-radius:12px;padding:6px 6px 6px 12px}
.mylist .it span{flex:1;font-weight:800}
.mylist .btn{min-height:40px;padding:6px 10px;font-size:14px}

/* ---- look 1985 ---- */
body.retro{background:#000;--case:#000;--case2:#0d0d0d;--line:#f2f2f2;--gold:#ffd23f;--muted:#c8c8c8;--ink:#f2f2f2;font-family:"Press Start 2P",monospace;font-size:12px;line-height:1.7}
body.retro .lvl,body.retro .logo,body.retro h2{font-family:"Press Start 2P",monospace;letter-spacing:0}
body.retro .lvl{font-size:14px}body.retro .lvl small{font:10px "Press Start 2P",monospace;margin-top:4px}
body.retro .logo{font-size:clamp(20px,4vw,34px);line-height:1.3;text-shadow:4px 4px 0 #d0581c;color:#ffd23f}
body.retro h2{font-size:20px;line-height:1.4;color:#ffd23f}
body.retro #stage{background:#000;border-radius:0;padding:8px;box-shadow:0 0 0 4px #f2f2f2,0 0 0 8px #000,0 0 0 12px #d0581c}
body.retro #stage::after{content:"";position:absolute;inset:8px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px)}
body.retro canvas,body.retro .ov{border-radius:0}
body.retro .ov{background:rgba(0,0,0,.82);backdrop-filter:none;z-index:2}
body.retro .panel{border-radius:0;border:4px solid #f2f2f2;box-shadow:8px 8px 0 #d0581c}
body.retro .btn,body.retro .ib,body.retro .seg,body.retro .card,body.retro .pal button,body.retro .erow input,body.retro textarea,body.retro .mylist .it{border-radius:0;font-family:"Press Start 2P",monospace;font-size:11px}
body.retro .btn{border-width:3px;line-height:1.5}
body.retro .btn.pri{background:#ffd23f;color:#000;border-color:#ffd23f;box-shadow:4px 4px 0 #d0581c}
body.retro .seg button{font:10px "Press Start 2P",monospace}body.retro .seg button.on{background:#f2f2f2;color:#000}
body.retro .card b{font:18px "Press Start 2P",monospace;color:#ffd23f;margin-bottom:6px}body.retro .card span{font-size:10px}
body.retro .stat i{border-radius:0;background:#ffd23f;box-shadow:none}
body.retro .hearts{color:#fff}
body.retro kbd{border-radius:0;font:10px "Press Start 2P",monospace;padding:4px 6px}
body.retro #help,body.retro #tip,body.retro p,body.retro .keys,body.retro .legend{font-size:10px;line-height:1.9}
body.retro #tip{color:#ffd23f}
body.retro #toast{border-radius:0;font:10px "Press Start 2P",monospace}

/* ---- contrôles tactiles ---- */
#arena{display:contents}
.pad{display:none}
body.touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.touch #help{display:none!important}
body.touch #app{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:8px;min-height:100dvh}
body.touch #arena{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"stage stage" "l r";gap:10px 16px;width:var(--w);max-width:100%;align-items:center}
body.touch #stage{grid-area:stage}
body.touch .pad{display:flex;align-items:center;touch-action:none}
body.touch #padL{grid-area:l;justify-content:flex-start}
body.touch #padR{grid-area:r;justify-content:flex-end;gap:12px}
#dpad{position:relative;width:var(--pad,150px);height:var(--pad,150px);border-radius:50%;background:radial-gradient(circle,#1d2347 0 30%,#141836 31%);border:3px solid var(--line);touch-action:none}
#dpad span{position:absolute;color:var(--muted);font-size:20px;line-height:1;pointer-events:none}
#dpad .u{top:10%;left:50%;transform:translateX(-50%)}#dpad .d{bottom:10%;left:50%;transform:translateX(-50%)}
#dpad .l{left:10%;top:50%;transform:translateY(-50%)}#dpad .r{right:10%;top:50%;transform:translateY(-50%)}
#dpad span.on{color:var(--gold)}
#dpad i{position:absolute;width:34%;height:34%;left:33%;top:33%;border-radius:50%;background:var(--case2);border:2px solid var(--line);pointer-events:none;transition:transform .05s}
.dig{width:calc(var(--pad,150px)*.56);height:calc(var(--pad,150px)*.56);border-radius:50%;border:3px solid var(--gold);background:var(--case2);color:var(--ink);font:800 12px Nunito,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
.dig b{font-size:24px;color:var(--gold);line-height:1}
.dig.on{background:var(--gold);color:#000}.dig.on b{color:#000}
#digL{margin-top:calc(var(--pad,150px)*.3)}
@media (orientation:landscape){
 body.touch #arena{grid-template-columns:auto auto auto;grid-template-areas:"l stage r";gap:14px;width:auto;justify-content:center}
 body.touch #stage{width:var(--w)}
 body.touch #padR{flex-direction:column;gap:14px}
 body.touch #digL{margin-top:0;margin-right:calc(var(--pad,150px)*.3)}
 body.touch #tip{display:none}
 body.touch #hud{width:100%}
}
body.retro #dpad{border-radius:0;background:#000;border:4px solid #f2f2f2}
body.retro #dpad i{border-radius:0;background:#000;border-color:#f2f2f2}
body.retro .dig{border-radius:0;background:#000;font:9px "Press Start 2P",monospace}
body.retro .dig.on{background:#ffd23f}
#bFull{display:none}body.touch #bFull.ok{display:grid}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:600px){.stats{gap:10px}.lvl{font-size:17px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="wrap">
    <div class="lvl" id="lvl">Pioche et Pépites<small>Une mine, des pépites, des robots</small></div>
    <div class="stats" id="stats">
      <div class="stat" title="Pépites restantes"><i></i><span id="sGold">0/0</span></div>
      <div class="stat hearts" id="sLives" title="Vies"></div>
      <div class="stat" title="Points"><span id="sScore">0</span></div>
    </div>
    <div class="tools">
      <button class="ib" id="bFull" title="Plein écran" aria-label="Plein écran">⛶</button>
      <button class="ib" id="bPause" title="Pause (Échap)" aria-label="Pause">❚❚</button>
      <button class="ib" id="bSound" title="Son" aria-label="Son">♪</button>
      <button class="ib" id="bMenu" title="Menu" aria-label="Menu">≡</button>
    </div>
  </div>
  <div id="arena">
  <div class="pad" id="padL"><div id="dpad" aria-label="Croix directionnelle"><span class="u">▲</span><span class="l">◀</span><span class="r">▶</span><span class="d">▼</span><i></i></div></div>
  <div id="stage" class="wrap">
    <canvas id="cv" width="896" height="512"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <div class="pad" id="padR"><button class="dig" id="digL" aria-label="Creuser à gauche"><b>◣</b>Creuser</button><button class="dig" id="digR" aria-label="Creuser à droite"><b>◢</b>Creuser</button></div>
  </div>
  <div id="tip" class="wrap"></div>
  <div id="editbar" class="wrap">
    <div class="pal" id="pal"></div>
    <div class="erow">
      <input id="edName" maxlength="28" aria-label="Nom du niveau" placeholder="Nom du niveau">
      <button class="btn pri" id="eTest">▶ Tester</button>
      <button class="btn" id="eSave">Enregistrer</button>
      <button class="btn" id="eMine">Mes niveaux</button>
      <button class="btn" id="eShare">Partager</button>
      <button class="btn" id="eClear">Vider</button>
    </div>
  </div>
  <div id="help" class="wrap">
    <span><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> bouger</span>
    <span><kbd>Z</kbd> creuser à gauche · <kbd>X</kbd> creuser à droite</span>
    <span><kbd>Échap</kbd> pause · <kbd>R</kbd> recommencer</span>
  </div>
</div>
<div id="toast"></div>
<script>
const W=28,H=16;
const EMPTY=0,BRICK=1,SOLID=2,LADDER=3,ROPE=4,TRAP=5,HLAD=6,HOLE=7;
const CH={' ':EMPTY,'#':BRICK,'@':SOLID,'H':LADDER,'-':ROPE,'X':TRAP,'S':HLAD};
const PLAYER_SPD=4.4,GUARD_RATIO=0.6,FALL_MUL=1.45,CLIMB_MUL=0.9;
const DIG_T=0.3,OPEN_T=5.6,FILL_T=0.9,TRAP_T=3.0,SPAWN_T=0.9;

function createGame(rows,hooks){
  hooks=hooks||{};
  const fx=n=>hooks.sfx&&hooks.sfx(n);
  const pt=(k,x,y)=>hooks.particles&&hooks.particles(k,x,y);
  const G={map:[],gold:[],holeGrid:[],holes:[],guards:[],P:null,goldLeft:0,revealed:false,spd:1,state:'play',t:0,score:0,dyingT:0,revealT:-9};
  const spawns=[];
  const mk=(kind,x,y)=>({kind,x,y,px:x,py:y,tx:x,ty:y,moving:false,mk:'idle',face:1,walk:0,alive:true,state:'walk',trapT:0,gold:false,goldSteps:0,escaping:false,spawnT:0,wait:0,dig:null,deadT:0});
  for(let y=0;y<H;y++){
    G.map.push([]);G.gold.push([]);G.holeGrid.push([]);
    for(let x=0;x<W;x++){
      const c=(rows[y]||'')[x]||' ';let t=CH[c];if(t===undefined)t=EMPTY;
      G.map[y].push(t);G.gold[y].push(c==='$');G.holeGrid[y].push(null);
      if(c==='$')G.goldLeft++;
      if(c==='P')G.P=mk('player',x,y);
      if(c==='E'){G.guards.push(mk('guard',x,y));spawns.push([x,y]);}
    }
  }
  if(!G.P)G.P=mk('player',1,H-2);
  G.totalGold=G.goldLeft;
  if(G.goldLeft===0)G.revealed=true;

  function tile(x,y){if(y>=H)return SOLID;if(y<0)return EMPTY;return G.map[y][wx(x)];}
  function wx(x){return((x%W)+W)%W;}
  function wd(a,b){const d=Math.abs(a-b)%W;return Math.min(d,W-d);}
  function blocking(x,y){const t=tile(x,y);return t===BRICK||t===SOLID;}
  function ladder(x,y){const t=tile(x,y);return t===LADDER||(t===HLAD&&G.revealed);}
  function rope(x,y){return tile(x,y)===ROPE;}
  function floorAt(x,y){if(y>=H)return true;const t=tile(x,y);return t===BRICK||t===SOLID||t===LADDER||(t===HLAD&&G.revealed);}
  function guardSupport(x,y,self){for(const g of G.guards)if(g!==self&&g.alive&&g.x===x&&g.y===y&&(g.state==='trapped'||!g.moving))return true;return false;}
  function supported(x,y,self){return ladder(x,y)||rope(x,y)||y>=H-1||floorAt(x,y+1)||guardSupport(x,y+1,self);}
  function supStatic(x,y){return ladder(x,y)||rope(x,y)||y>=H-1||floorAt(x,y+1)||G.guards.some(g=>g.alive&&g.state==='trapped'&&g.x===x&&g.y===y+1);}
  function guardOcc(x,y,self){x=wx(x);return G.guards.some(g=>g!==self&&g.alive&&((g.x===x&&g.y===y)||(g.moving&&wx(g.tx)===x&&g.ty===y)));}
  function startMove(e,dx,dy,k){e.tx=e.x+dx;e.ty=e.y+dy;e.moving=true;e.mk=k;if(dx)e.face=dx;}

  // ---------- pathfinding ----------
  const prev=new Int32Array(W*H),queue=new Int32Array(W*H),nb=[];
  function nbrs(x,y){
    nb.length=0;
    if(!supStatic(x,y)){if(y+1<H&&!blocking(x,y+1))nb.push(x,y+1);return nb;}
    if(!blocking(x-1,y))nb.push(wx(x-1),y);
    if(!blocking(x+1,y))nb.push(wx(x+1),y);
    if(ladder(x,y)&&y>0&&!blocking(x,y-1))nb.push(x,y-1);
    if(y+1<H&&!blocking(x,y+1))nb.push(x,y+1);
    return nb;
  }
  function pathStep(sx,sy,tx,ty){
    prev.fill(-1);const s=sy*W+sx;prev[s]=s;let qh=0,qt=0;queue[qt++]=s;
    let best=s,bestSc=Math.abs(ty-sy)*3+wd(tx,sx);
    while(qh<qt){
      const c=queue[qh++],cx=c%W,cy=(c/W)|0;
      if(cx===tx&&cy===ty){best=c;break;}
      const sc=Math.abs(ty-cy)*3+wd(tx,cx);if(sc<bestSc){bestSc=sc;best=c;}
      const n=nbrs(cx,cy);
      for(let i=0;i<n.length;i+=2){const k=n[i+1]*W+n[i];if(prev[k]<0){prev[k]=c;queue[qt++]=k;}}
    }
    if(best===s)return null;
    let c=best;while(prev[c]!==s)c=prev[c];
    return [c%W,(c/W)|0];
  }

  // ---------- digging & holes ----------
  function digBlocked(hx,ay,hy){
    return G.guards.some(g=>g.alive&&((wx(Math.round(g.px))===hx&&(Math.round(g.py)===ay||Math.round(g.py)===hy))||(g.moving&&wx(g.tx)===hx&&(g.ty===ay||g.ty===hy))));
  }
  function tryDig(p,dir){
    const tx=wx(p.x+dir),ty=p.y+1;
    if(ty>=H)return false;
    p.face=dir;
    if(tile(tx,ty)!==BRICK||G.holeGrid[ty][tx])return false;
    if(blocking(tx,p.y)||ladder(tx,p.y)||G.gold[p.y][tx])return false;
    if(digBlocked(tx,p.y,ty))return false;
    const h={x:tx,y:ty,state:'dig',t:0};G.holes.push(h);G.holeGrid[ty][tx]=h;
    p.dig={dir,t:0,h};fx('dig');pt('dig',tx,ty);
    return true;
  }
  function removeHole(h){const i=G.holes.indexOf(h);if(i>=0)G.holes.splice(i,1);G.holeGrid[h.y][h.x]=null;}
  function inCell(e,x,y){return(wx(Math.round(e.px))===x&&Math.round(e.py)===y)||(e.moving&&wx(e.tx)===x&&e.ty===y);}
  function updateHoles(sd){
    for(let i=G.holes.length-1;i>=0;i--){
      const h=G.holes[i];h.t+=sd;
      if(h.state==='dig'){if(h.t>=DIG_T){h.state='open';h.t=0;G.map[h.y][h.x]=HOLE;}}
      else if(h.state==='open'){if(h.t>=OPEN_T){h.state='fill';h.t=0;}}
      else if(h.t>=FILL_T){
        G.map[h.y][h.x]=BRICK;removeHole(h);
        if(G.state==='play'&&inCell(G.P,h.x,h.y))die();
        for(const g of G.guards)if(g.alive&&inCell(g,h.x,h.y))killGuard(g);
      }
    }
  }

  // ---------- player ----------
  function playerDecide(p,input){
    if(!supported(p.x,p.y,p)){startMove(p,0,1,'fall');return;}
    if(input.digL&&tryDig(p,-1))return;
    if(input.digR&&tryDig(p,1))return;
    for(const d of input.order){
      if(d==='up'){if(ladder(p.x,p.y)&&p.y>0&&!blocking(p.x,p.y-1)){startMove(p,0,-1,'climb');return;}}
      else if(d==='down'){
        if(p.y<H-1&&!blocking(p.x,p.y+1)&&!guardOcc(p.x,p.y+1,null)){startMove(p,0,1,(ladder(p.x,p.y)||ladder(p.x,p.y+1))?'climb':'drop');return;}
      } else {
        const dx=d==='left'?-1:1;
        if(!blocking(p.x+dx,p.y)){startMove(p,dx,0,'side');return;}
        p.face=dx;
      }
    }
    p.mk='idle';
  }
  function rev(e){let a=e.x;e.x=e.tx;e.tx=a;a=e.y;e.y=e.ty;e.ty=a;if(e.x<0||e.x>=W){const k=e.x<0?W:-W;e.x+=k;e.tx+=k;e.px+=k;}if(e.tx!==e.x)e.face=Math.sign(e.tx-e.x);}
  function maybeReverse(p,input){
    const dx=p.tx-p.x,dy=p.ty-p.y,h=input.held;
    if(dx){const b=dx>0?'left':'right',f=dx>0?'right':'left';if(h[b]&&!h[f])rev(p);}
    else if(dy&&p.mk==='climb'){const b=dy>0?'up':'down',f=dy>0?'down':'up';if(h[b]&&!h[f])rev(p);}
  }
  function playerArrive(p){
    if(G.gold[p.y][p.x]){
      G.gold[p.y][p.x]=false;G.goldLeft--;G.score+=250;fx('gold');pt('gold',p.x,p.y);
      if(G.goldLeft===0)reveal();
    }
    if(G.goldLeft===0&&p.y===0)win();
  }
  function reveal(){G.revealed=true;G.revealT=G.t;fx('reveal');pt('reveal');}
  function win(){if(G.state!=='play')return;G.state='won';G.score+=1500;fx('win');hooks.onWin&&hooks.onWin();}
  function die(){if(G.state!=='play')return;G.state='dying';G.dyingT=0;fx('die');pt('die',G.P.px,G.P.py);hooks.onDie&&hooks.onDie();}

  // ---------- guards ----------
  function guardDecide(g){
    if(g.state!=='walk'||g.spawnT>0||g.wait>0)return;
    const P=G.P;
    if(g.escaping){
      g.escaping=false;
      const pref=Math.sign(P.x-g.x)||(Math.random()<.5?-1:1);
      for(const d of [pref,-pref]){
        const nx=g.x+d;
        if(!blocking(nx,g.y)&&!guardOcc(nx,g.y,g)&&tile(nx,g.y)!==HOLE){startMove(g,d,0,'side');return;}
      }
    }
    if(!supported(g.x,g.y,g)){if(!guardOcc(g.x,g.y+1,g))startMove(g,0,1,'fall');return;}
    const st=pathStep(g.x,g.y,Math.round(P.px),Math.round(P.py));
    if(st&&!guardOcc(st[0],st[1],g)){
      const dx=st[0]-g.x,dy=st[1]-g.y;
      startMove(g,dx,dy,dy<0?'climb':dy>0?((ladder(g.x,g.y)||ladder(st[0],st[1]))?'climb':'drop'):'side');
      return;
    }
    g.wait=0.2;
  }
  function guardArrive(g){
    if(tile(g.x,g.y)===HOLE&&G.holeGrid[g.y][g.x]){
      g.state='trapped';g.trapT=0;g.moving=false;G.score+=75;fx('trap');
      if(g.gold){const ay=g.y-1,t=tile(g.x,ay);
        if(ay>=0&&!G.gold[ay][g.x]&&(t===EMPTY||t===ROPE||t===HLAD)){G.gold[ay][g.x]=true;g.gold=false;}}
      return;
    }
    if(g.gold){
      if(--g.goldSteps<=0&&tile(g.x,g.y)===EMPTY&&!G.gold[g.y][g.x]&&(tile(g.x,g.y+1)===BRICK||tile(g.x,g.y+1)===SOLID)){G.gold[g.y][g.x]=true;g.gold=false;}
    } else if(G.gold[g.y][g.x]&&Math.random()<0.55){
      G.gold[g.y][g.x]=false;g.gold=true;g.goldSteps=5+Math.floor(Math.random()*14);
    }
  }
  function killGuard(g){g.alive=false;g.deadT=1.0;g.moving=false;g.state='walk';g.escaping=false;G.score+=75;fx('kill');pt('poof',g.px,g.py);}
  function respawn(g){
    const P=G.P;let c=[];
    for(let y=0;y<5&&!c.length;y++)for(let x=0;x<W;x++)
      if(tile(x,y)===EMPTY&&!G.gold[y][x]&&!guardOcc(x,y,g)&&Math.abs(x-P.x)+Math.abs(y-P.y)>6)c.push([x,y]);
    if(!c.length)c=spawns.slice();
    const [x,y]=c[Math.floor(Math.random()*c.length)];
    Object.assign(g,{x,y,px:x,py:y,tx:x,ty:y,alive:true,state:'walk',spawnT:SPAWN_T,moving:false,trapT:0,wait:0});
  }
  function updateGuard(g,sd){
    if(!g.alive){g.deadT-=sd;if(g.deadT<=0)respawn(g);return;}
    if(g.spawnT>0){g.spawnT-=sd;return;}
    if(g.wait>0)g.wait-=sd;
    if(g.state==='trapped'){
      g.trapT+=sd;
      if(g.trapT<TRAP_T)return;
      if(!blocking(g.x,g.y-1)&&!guardOcc(g.x,g.y-1,g)){g.state='walk';g.escaping=true;startMove(g,0,-1,'climb');}
      else{g.trapT=TRAP_T-0.25;return;}
    }
    advance(g,sd*PLAYER_SPD*GUARD_RATIO,null);
  }

  // ---------- movement ----------
  function advance(e,dist,input){
    for(let n=0;n<6;n++){
      if(!e.moving){
        if(e.kind==='player')playerDecide(e,input);else guardDecide(e);
        if(!e.moving||e.dig)return;
      }
      const mul=e.mk==='fall'?FALL_MUL:e.mk==='climb'?CLIMB_MUL:1;
      const need=Math.abs(e.tx-e.px)+Math.abs(e.ty-e.py),can=dist*mul;
      if(can>=need){
        e.x=wx(e.tx);e.y=e.ty;e.tx=e.x;e.px=e.x;e.py=e.ty;e.moving=false;e.walk+=need;dist-=need/mul;
        if(e.kind==='player')playerArrive(e);else guardArrive(e);
        if(G.state!=='play'||e.state==='trapped')return;
      } else {
        e.px+=Math.sign(e.tx-e.px)*can;e.py+=Math.sign(e.ty-e.py)*can;e.walk+=can;return;
      }
    }
  }
  function updatePlayer(sd,input){
    const p=G.P;
    if(p.dig){
      p.dig.t+=sd;const h=p.dig.h;
      if(h.state==='dig'&&digBlocked(h.x,p.y,h.y)){removeHole(h);p.dig=null;}
      else if(p.dig.t>=DIG_T)p.dig=null;
      return;
    }
    if(p.moving&&p.mk!=='fall'&&p.mk!=='drop')maybeReverse(p,input);
    advance(p,sd*PLAYER_SPD,input);
  }
  function checkCollisions(){
    const p=G.P;
    for(const g of G.guards)if(g.alive&&g.spawnT<=0&&wd(g.px,p.px)<0.72&&Math.abs(g.py-p.py)<0.72){die();return;}
  }
  function update(dt,input){
    if(G.state==='dying'){G.dyingT+=dt;return;}
    if(G.state!=='play')return;
    const sd=dt*G.spd;G.t+=sd;
    updateHoles(sd);if(G.state!=='play')return;
    updatePlayer(sd,input);if(G.state!=='play')return;
    for(const g of G.guards)updateGuard(g,sd);
    checkCollisions();
  }
  return {G,update,tile,ladder,rope,floorAt,restartDie:die};
}

    case 'climb':if(f===0){R(3,3,1,6,A);R(3,2,1,1,Hd);R(12,6,1,5,A);R(12,5,1,1,Hd);}else{R(12,3,1,6,A);R(12,2,1,1,Hd);R(3,6,1,5,A);R(3,5,1,1,Hd);}break;
    case 'hang':R(3,3,1,6,A);R(12,3,1,6,A);R(3,2,1,1,Hd);R(12,2,1,1,Hd);break;
    case 'fall':R(3,4,1,4,A);R(12,4,1,4,A);R(3,3,1,1,Hd);R(12,3,1,1,Hd);break;
    case 'dig':R(4,8,1,4,A);R(4,12,1,1,Hd);
      if(f===0){R(11,8,2,1,A);R(13,8,1,1,Hd);R(13,7,1,1,'#8b5a2b');R(14,6,1,1,'#8b5a2b');R(13,4,3,1,'#cbd5e1');R(15,5,1,1,'#94a3b8');R(12,4,1,1,'#94a3b8');}
      else{R(11,9,2,1,A);R(13,9,1,1,Hd);R(14,10,1,1,'#8b5a2b');R(15,11,1,1,'#8b5a2b');R(14,13,2,1,'#cbd5e1');R(15,12,1,1,'#94a3b8');}break;
    default:R(4,8,1,4,A);R(11,8,1,4,A);R(4,12,1,1,Hd);R(11,12,1,1,Hd);
  }
  if(kind==='miner'){
    R(5,1,6,1,P.a);R(4,2,8,2,P.a);R(5,2,3,1,P.hi);R(3,4,10,1,P.a2);
    if(back)R(5,5,6,3,P.hair);
    else{R(10,2,2,2,P.lamp);R(5,5,6,3,P.skin);R(9,6,1,1,P.eye);R(10,7,1,1,'#e8a37c');}
  } else {
    R(7,0,2,1,P.ant);R(4,1,8,6,P.a);R(4,1,8,1,P.hi);R(4,6,8,1,P.a2);R(5,3,6,2,P.visor);
    if(!back)R(8,3,2,2,o.eye||P.eye);else R(7,3,2,1,P.a2);
  }
  if(o.gold){R(10,10,4,2,'#eab308');R(10,10,4,1,'#fde047');}
}

const SPRR={};
function px8(x,rows,cols){rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.'&&cols[ch]){x.fillStyle=cols[ch];x.fillRect(i*4,y*4,4,4);}}});}
SPRR.brick=mk(32,32,x=>px8(x,['bbbbbbb.','bbbbbbb.','bbbbbbb.','........','bbb.bbbb','bbb.bbbb','bbb.bbbb','........'],{b:'#d0581c'}));
SPRR.solid=mk(32,32,x=>px8(x,['llllllll','lsssssss','lsssssss','lsssssss','lsssssss','lsssssss','lsssssss','ssssssss'],{l:'#b9c3d6',s:'#7a86a3'}));
SPRR.ladder=mk(32,32,x=>px8(x,['.w....w.','.wwwwww.','.w....w.','.w....w.','.w....w.','.wwwwww.','.w....w.','.w....w.'],{w:'#f2f2f2'}));
SPRR.esc=mk(32,32,x=>px8(x,['.w....w.','.wwwwww.','.w....w.','.w....w.','.w....w.','.wwwwww.','.w....w.','.w....w.'],{w:'#5ef2e6'}));
SPRR.rope=mk(32,32,x=>px8(x,['........','wwwwwwww'],{w:'#f2f2f2'}));
SPRR.gold=mk(32,32,x=>px8(x,['........','........','........','........','..yyyy..','.yoooyy.','.yyyyyy.','.yyyyyy.'],{y:'#ffd23f',o:'#b8860b'}));
SPRR.trapEd=mk(32,32,x=>{x.drawImage(SPRR.brick,0,0);x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,0,32,32);x.strokeStyle='#ff4fd8';x.lineWidth=4;x.setLineDash([4,4]);x.strokeRect(2,2,28,28);});
SPRR.escEd=mk(32,32,x=>{x.globalAlpha=.6;x.drawImage(SPRR.esc,0,0);});
SPRR.bg=mk(W*TS,H*TS,x=>{x.fillStyle='#000';x.fillRect(0,0,W*TS,H*TS);});
// Bonshommes allumettes 8×8, tournés vers la droite
const STICK={
 stand:[['...##...','...##...','..####..','.#.##.#.','...##...','..#..#..','..#..#..','..#..#..']],
 run:[['....##..','....##..','..####..','.#..#.#.','....#...','...#.#..','..#...#.','.#.....#'],

 climb:[['#..##...','.#.##...','..####.#','...##.#.','...##...','..#..#..','..#..#..','..#.....'],
        ['...##..#','...##.#.','#.####..','.#.##...','...##...','..#..#..','..#..#..','.....#..']],
 hang:[['.#....#.','.#.##.#.','..####..','...##...','...##...','..#..#..','..#..#..','..#..#..'],
       ['.#....#.','.#.##.#.','..####..','...##...','...##...','...#.#..','..#..#..','..#...#.']],
 fall:[['#..##..#','.#.##.#.','..####..','...##...','...##...','..#..#..','.#....#.','#......#']],

function drawStick(c,kind,X,Y,pose,f,face,o){

let parts=[];
function burst(x,y,n,cols,sp,grav,life){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.4+Math.random());
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,g:grav,life,max:life,c:cols[i%cols.length],s:Math.random()<.5?2:4});}}
function particles(kind,x,y){
  const cx=x*TS+16,cy=y*TS+16;
  if(kind==='gold')burst(cx,cy,14,['#fde047','#fbbf24','#fffbeb'],150,250,.6);
  else if(kind==='dig')burst(cx,cy-10,10,['#c2553a','#93392a','#e07a57'],90,500,.5);
  else if(kind==='poof')burst(cx,cy,18,['#c084fc','#f0abfc','#ffffff'],140,80,.7);
  else if(kind==='die')burst(cx,cy,26,['#facc15','#3b82f6','#ffffff','#fb7185'],180,300,1);
  else if(kind==='reveal'&&game){const M=game.G.map;for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++)if(M[yy][xx]===6)burst(xx*TS+16,yy*TS+16,3,['#5eead4','#a7f3d0','#ffffff'],60,-20,.9);}
}

const held={left:false,right:false,up:false,down:false};let order=[];let digL=0,digR=0,digLH=false,digRH=false;
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  const d=KM[e.code];
  if(d){e.preventDefault();if(!held[d]){held[d]=true;order=[d,...order.filter(o=>o!==d)];}}
  if(e.code==='KeyZ'||e.code==='KeyQ'){digLH=true;digL=performance.now();e.preventDefault();}
  if(e.code==='KeyX'||e.code==='KeyE'){digRH=true;digR=performance.now();e.preventDefault();}
  if(e.code==='Space')e.preventDefault();
  if(e.repeat)return;
  if(e.code==='Escape'||e.code==='KeyP'){if(mode==='play')pause();else if(mode==='pause')resume();}
  if(e.code==='KeyR'&&mode==='play'&&game&&game.G.state==='play'&&started)game.restartDie();
  if(e.code==='Enter'||e.code==='Space'){const b=document.querySelector('#ov.on .pri');if(b){e.preventDefault();b.click();}}
});
addEventListener('keyup',e=>{const d=KM[e.code];if(d){held[d]=false;order=order.filter(o=>o!==d);}
  if(e.code==='KeyZ'||e.code==='KeyQ')digLH=false;if(e.code==='KeyX'||e.code==='KeyE')digRH=false;});
addEventListener('blur',()=>{for(const k in held)held[k]=false;order=[];digLH=digRH=false;if(mode==='play'&&started)pause();});
function getInput(){const n=performance.now();return{held,order:order.filter(d=>held[d]),digL:digLH||n-digL<450,digR:digRH||n-digR<450};}

function drawMap(gm,t,editor){
  const G=gm.G;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=G.map[y][x],X=x*TS,Y=y*TS,h=G.holeGrid[y][x];
    if(h)continue;
    if(v===1||v===5)ctx.drawImage(SPR.brick,X,Y);
    else if(v===2)ctx.drawImage(SPR.solid,X,Y);
    else if(v===3)ctx.drawImage(SPR.ladder,X,Y);
    else if(v===4)ctx.drawImage(SPR.rope,X,Y);
    else if(v===6&&G.revealed){ctx.drawImage(SPR.esc,X,Y);}
  }
  for(const h of G.holes){const X=h.x*TS,Y=h.y*TS;
    if(h.state==='dig'){const k=Math.min(1,h.t/0.3),c=Math.floor(k*30);ctx.drawImage(SPR.brick,0,c,32,32-c,X,Y+c,32,32-c);}
    else if(h.state==='open'){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(X,Y,32,32);ctx.fillStyle='#3a140d';ctx.fillRect(X,Y+28,32,4);}
    else{const k=Math.min(1,h.t/0.9),c=Math.ceil(k*32);ctx.drawImage(SPR.brick,0,32-c,32,c,X,Y+32-c,32,c);}
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(G.gold[y][x]){
    ctx.drawImage(SPR.gold,x*TS,y*TS);
    const ph=(t*1.3+x*.37+y*.71)%3;
    if(ph<.35&&!retro()){const s=ph<.17?2:4;ctx.fillStyle='#fffbeb';ctx.fillRect(x*TS+20,y*TS+16-s/2,2,s+2);ctx.fillRect(x*TS+21-s/2-1,y*TS+17,s+2,2);}
  }
}
function poseOf(gm,e,G){
  if(e.dig)return['dig',e.dig.t<.15?0:1];
  if(e.state==='trapped')return['hang',Math.floor(G.t*6)%2];
  const fr=Math.floor(e.walk*3)%2;
  if(e.moving){
    if(e.mk==='fall'||e.mk==='drop')return['fall',0];
    if(e.mk==='climb')return['climb',fr];
    if(gm.rope(e.x,e.y)||gm.rope(e.tx,e.ty))return['hang',fr];
    return['run',fr];
  }
  if(gm.rope(e.x,e.y))return['hang',0];
  if(gm.ladder(e.x,e.y)&&!gm.floorAt(e.x,e.y+1))return['climb',0];
  return['stand',0];
}
function wrapX(X){const r=[X];if(X<0)r.push(X+W*TS);else if(X>(W-1)*TS)r.push(X-W*TS);return r;}
function drawEntities(gm,t){
  const G=gm.G;
  for(const g of G.guards){if(!g.alive)continue;if(g.spawnT>0&&Math.floor(t*14)%2)continue;
    const [p,f]=poseOf(gm,g,G);let X=g.px*TS,Y=g.py*TS;
    if(g.state==='trapped'&&g.trapT>2.2)X+=Math.sin(t*60)*2;
    for(const ox of wrapX(X))drawFig(ctx,'robot',Math.round(ox),Math.round(Y),p,f,g.face,{gold:g.gold});}
  const P=G.P;
  if(G.state==='dying'){if(Math.floor(G.dyingT*10)%2)return;}
  const [p,f]=poseOf(gm,P,G);
  if(p!=='climb'&&!retro()){const lx=P.px*TS+(P.face>0?24:8),ly=P.py*TS+6;const gr=ctx.createRadialGradient(lx,ly,1,lx,ly,26);gr.addColorStop(0,'rgba(255,245,200,.22)');gr.addColorStop(1,'rgba(255,245,200,0)');ctx.fillStyle=gr;ctx.fillRect(lx-26,ly-26,52,52);}
  for(const ox of wrapX(P.px*TS))drawFig(ctx,'miner',Math.round(ox),Math.round(P.py*TS),p,f,P.face);
}
function drawParts(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}
    q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;ctx.globalAlpha=Math.min(1,q.life/q.max*1.6);ctx.fillStyle=q.c;if(retro())ctx.fillRect((q.x>>2)<<2,(q.y>>2)<<2,4,4);else ctx.fillRect(q.x|0,q.y|0,q.s,q.s);}
  ctx.globalAlpha=1;
}
function banner(txt,sub,a){
  ctx.globalAlpha=a;ctx.fillStyle=retro()?'#000':'rgba(9,11,28,.8)';const w=Math.max(420,txt.length*(retro()?21:17)+60);ctx.fillRect(448-w/2,206,w,sub?100:70);
  ctx.strokeStyle=retro()?'#fff':'#fbbf24';ctx.lineWidth=retro()?4:3;ctx.strokeRect(448-w/2+1.5,207.5,w-3,(sub?100:70)-3);
  ctx.fillStyle=retro()?'#ffd23f':'#fbbf24';ctx.font=retro()?'20px "Press Start 2P",monospace':'30px "Lilita One",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,448,sub?240:241);
  if(sub){ctx.fillStyle='#f6f0dc';ctx.font=retro()?'11px "Press Start 2P",monospace':'800 16px Nunito,system-ui';ctx.fillText(sub,448,276);}
  ctx.globalAlpha=1;
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  ctx.drawImage(SPR.bg,0,0);
  if(mode==='editor'){drawEditor(t);}
  else if(game){
    const G=game.G;
    if(mode==='play'){
      const inp=getInput();
      if(!started&&(inp.order.length||inp.digL||inp.digR))started=true;
      if(started)game.update(dt,inp);
      if(G.state==='dying'&&G.dyingT>1.4){lives--;score=G.score;if(lives<=0){showOver();}else restartSame();}
      if(winT>=0){winT+=dt;if(winT>.9){winT=-1;showWin();}}
      updHud();
    }
    drawMap(game,t);drawEntities(game,t);drawParts(mode==='pause'?0:dt);
    if(mode==='play'&&!started)banner(levelLabel(),isTouch?'Touche la croix pour commencer':'Appuie sur une flèche pour commencer',1);
    else if(mode==='play'&&G.revealed&&G.t-G.revealT<2.4&&G.revealT>0)banner('La sortie est ouverte !','Grimpe tout en haut par l\'échelle turquoise',Math.min(1,(2.4-(G.t-G.revealT))*2));
  } else {
    if(!preview)preview=createGame(LEVELS[0].rows,{});drawMap(preview,t);drawEntities(preview,t);
  }
  requestAnimationFrame(frame);
}

// ================= editor =================
const TOOLS=[['#','Brique'],['@','Roc'],['H','Échelle'],['-','Corde'],['$','Pépite'],['P','Mineur'],['E','Gardien'],['S','Sortie'],['X','Fausse brique'],[' ','Gomme']];
const ED={grid:null,tool:'#',paint:false,erase:false,hover:null};
function blank(){const g=[];for(let y=0;y<H;y++)g.push((y===H-1?'@'.repeat(W):' '.repeat(W)).split(''));g[H-2][1]='P';return g;}
const pal=$('pal');
function buildPal(){pal.innerHTML=TOOLS.map(([k,l])=>`<button data-t="${k}" class="${k===ED.tool?'on':''}"><img src="${ICON[k]}" alt="">${l}</button>`).join('');}
pal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ED.tool=b.dataset.t;pal.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
function showEditBar(on){$('editbar').style.display=on?'flex':'none';$('help').style.display=on?'none':'flex';fit();}
function openEditor(){
  if(!ED.grid){ED.grid=blank();$('edName').value='Mon niveau';}
  mode='editor';testing=false;game=null;cur=null;closeOv();$('tip').textContent='';showEditBar(true);updHud(true);
}
function edRows(){return ED.grid.map(r=>r.join(''));}
function edSet(x,y,c){
  const g=ED.grid;if(x<0||y<0||x>=W||y>=H)return;
  if(g[y][x]===c)return;
  if(c==='P'){for(const r of g)for(let i=0;i<W;i++)if(r[i]==='P')r[i]=' ';}
  if(c==='E'&&g.flat().filter(v=>v==='E').length>=8){toast('8 gardiens maximum');return;}
  g[y][x]=c;
}
function cellOf(e){const r=cv.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H)];}
cv.addEventListener('pointerdown',e=>{if(mode!=='editor')return;e.preventDefault();ED.paint=true;ED.erase=e.button===2;cv.setPointerCapture(e.pointerId);const [x,y]=cellOf(e);edSet(x,y,ED.erase?' ':ED.tool);});
cv.addEventListener('pointermove',e=>{if(mode!=='editor')return;const [x,y]=cellOf(e);ED.hover=[x,y];if(ED.paint){const c=ED.erase?' ':ED.tool;if(c!=='P')edSet(x,y,c);}});
cv.addEventListener('pointerup',()=>ED.paint=false);cv.addEventListener('pointerleave',()=>ED.hover=null);
cv.addEventListener('contextmenu',e=>{if(mode==='editor')e.preventDefault();});
function drawEditor(t){
  const g=ED.grid;
  ctx.strokeStyle='rgba(169,174,214,.08)';ctx.lineWidth=1;
  for(let x=1;x<W;x++){ctx.beginPath();ctx.moveTo(x*TS+.5,0);ctx.lineTo(x*TS+.5,H*TS);ctx.stroke();}
  for(let y=1;y<H;y++){ctx.beginPath();ctx.moveTo(0,y*TS+.5);ctx.lineTo(W*TS,y*TS+.5);ctx.stroke();}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=g[y][x],X=x*TS,Y=y*TS;
    if(c==='#')ctx.drawImage(SPR.brick,X,Y);else if(c==='@')ctx.drawImage(SPR.solid,X,Y);else if(c==='H')ctx.drawImage(SPR.ladder,X,Y);
    else if(c==='-')ctx.drawImage(SPR.rope,X,Y);else if(c==='X')ctx.drawImage(SPR.trapEd,X,Y);else if(c==='S')ctx.drawImage(SPR.escEd,X,Y);
    else if(c==='$')ctx.drawImage(SPR.gold,X,Y);else if(c==='P')drawFig(ctx,'miner',X,Y,'stand',0,1);else if(c==='E')drawFig(ctx,'robot',X,Y,'stand',0,-1);}
  if(ED.hover){const [x,y]=ED.hover;ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.strokeRect(x*TS+1,y*TS+1,30,30);}
}
function validate(){const f=ED.grid.flat();
  if(!f.includes('P')){toast('Place le mineur quelque part');return false;}
  if(!f.includes('$')){toast('Ajoute au moins une pépite');return false;}
  return true;}
function edName(){return($('edName').value||'Mon niveau').trim().slice(0,28)||'Mon niveau';}
$('eTest').onclick=()=>{if(!validate())return;testing=true;showEditBar(false);startLevel({custom:true,level:{name:edName(),rows:edRows()}},true);
  if(!ED.grid.flat().includes('S')&&!ED.grid[0].some(c=>c==='H'))toast('Astuce : ajoute une échelle de sortie qui monte jusqu\'en haut');};
$('eSave').onclick=()=>{if(!validate())return;const n=edName(),i=custom.findIndex(l=>l.name===n);const l={name:n,rows:edRows()};
  if(i>=0)custom[i]=l;else custom.push(l);store.set('pp_custom',custom);toast('« '+n+' » enregistré');};
$('eClear').onclick=()=>{ED.grid=blank();toast('Grille vidée');};
function showMine(){mode='edmodal';
  openOv(`<div class="panel"><h2>Mes niveaux</h2>${custom.length?`<div class="mylist">${custom.map((l,i)=>`<div class="it"><span>${esc(l.name)}</span><button class="btn" data-a="edPlay" data-v="${i}">Jouer</button><button class="btn" data-a="edLoad" data-v="${i}">Modifier</button><button class="btn" data-a="edDel" data-v="${i}" aria-label="Supprimer">✕</button></div>`).join('')}</div>`:'<p>Aucun niveau enregistré pour l\'instant. Dessine-en un, puis appuie sur Enregistrer.</p>'}
  <p style="font-size:13px">Les niveaux sont gardés dans ce navigateur seulement. Utilise Partager pour les envoyer ailleurs.</p>
  <div class="row"><button class="btn pri" data-a="edClose">Fermer</button></div></div>`);}
$('eMine').onclick=showMine;
function encode(){const s=edName()+'|'+edRows().join('');return'PP1.'+btoa(unescape(encodeURIComponent(s)));}
function decode(c){try{if(!c.startsWith('PP1.'))return null;const s=decodeURIComponent(escape(atob(c.slice(4))));const i=s.lastIndexOf('|');const body=s.slice(i+1);
  if(body.length!==W*H)return null;const rows=[];for(let y=0;y<H;y++)rows.push(body.slice(y*W,y*W+W));return{name:s.slice(0,i)||'Niveau importé',rows};}catch(e){return null}}
$('eShare').onclick=()=>{mode='edmodal';openOv(`<div class="panel"><h2>Partager</h2><p>Copie ce code pour garder ou envoyer ce niveau.</p>
  <textarea id="code" readonly>${encode()}</textarea><div class="row" style="margin:10px 0 18px"><button class="btn" data-a="copy">Copier le code</button></div>
  <p>Ou colle le code d'un niveau ici pour l'ouvrir :</p><textarea id="imp" placeholder="PP1.…"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn" data-a="import">Importer</button><button class="btn pri" data-a="edClose">Fermer</button></div></div>`);};


// ================= tactile =================
let isTouch=false;
function enableTouch(){if(isTouch)return;isTouch=true;document.body.classList.add('touch');
  if(document.documentElement.requestFullscreen)$('bFull').classList.add('ok');fit();}
// Seulement sur téléphone/tablette (pas de souris, pas de survol) : jamais sur un ordinateur
if(matchMedia('(hover:none) and (pointer:coarse)').matches)enableTouch();
const dpad=$('dpad'),knob=dpad.querySelector('i');let padId=null;
function setDir(d){for(const k of ['left','right','up','down']){const on=k===d;
    if(on&&!held[k]){held[k]=true;order=[k,...order.filter(o=>o!==k)];}
    if(!on&&held[k]&&padId!==null){held[k]=false;order=order.filter(o=>o!==k);}}
  dpad.querySelectorAll('span').forEach(s=>s.classList.toggle('on',d&&s.className.startsWith({left:'l',right:'r',up:'u',down:'d'}[d])));}
function padMove(e){const r=dpad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),dist=Math.hypot(dx,dy),R=r.width/2;
  const k=Math.min(1,dist/R)*R*.33;knob.style.transform=`translate(${dist?dx/dist*k:0}px,${dist?dy/dist*k:0}px)`;
  setDir(dist<R*.18?null:Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'));}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;dpad.setPointerCapture(e.pointerId);ac();padMove(e);});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padMove(e);});
function padEnd(e){if(e.pointerId!==padId)return;setDir(null);padId=null;knob.style.transform='';}
dpad.addEventListener('pointerup',padEnd);dpad.addEventListener('pointercancel',padEnd);
function digBtn(id,side){const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');ac();
    if(side<0){digLH=true;digL=performance.now();}else{digRH=true;digR=performance.now();}try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}});
  const up=()=>{b.classList.remove('on');if(side<0)digLH=false;else digRH=false;};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('contextmenu',e=>e.preventDefault());}
digBtn('digL',-1);digBtn('digR',1);
$('bFull').onclick=()=>{const d=document;try{(d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen({navigationUI:'hide'})).then(()=>setTimeout(fit,200)).catch(()=>toast('Plein écran non disponible ici'));}catch(_){toast('Plein écran non disponible ici');}};
document.addEventListener('dblclick',e=>{if(isTouch)e.preventDefault();},{passive:false});

// ================= layout =================
function fit(){const ed=$('editbar').style.display==='flex';
  if(isTouch&&!ed){const land=innerWidth>innerHeight;
    const pad=Math.round(Math.max(110,Math.min(170,(land?innerHeight*0.42:innerWidth*0.38))));document.documentElement.style.setProperty('--pad',pad+'px');
    const w=land?Math.min(innerWidth-2*pad-60,(innerHeight-70)*W/H+16):Math.min(innerWidth-16,(innerHeight-pad-150)*W/H+16);
    document.documentElement.style.setProperty('--w',Math.max(240,Math.min(w,1180))+'px');return;}
  const reserve=ed?250:130;
  const w=Math.max(280,Math.min(innerWidth-24,(innerHeight-reserve)*W/H+20,1180));document.documentElement.style.setProperty('--w',w+'px');}
addEventListener('resize',fit);fit();
applyTheme();
showMenu();
requestAnimationFrame(frame);

}
</script>
